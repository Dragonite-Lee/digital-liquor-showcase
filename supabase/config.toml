# 앱은 익명 로그인한 사용자 토큰(Authorization)과 publishable 키(apikey)를 보낸다.
# 플랫폼의 verify_jwt 검사는 새 API 키·서명 키와 맞지 않는 경우가 있어 끄고,
# 함수 안에서 supabase/functions/_shared/auth.ts가 토큰을 검증한다.
[functions.classify-bottle]
verify_jwt = false

[functions.illustrate-bottle]
verify_jwt = false
